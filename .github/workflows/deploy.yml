name: Build a deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE_HOST: dokuio.com
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Nastavení odesílání e-mailů (SMTP ze secretů)
        if: env.SMTP_PASSWORD != ''
        run: |
          python3 - <<'PY'
          import base64, json, os, secrets
          uzivatel = os.environ.get('SMTP_USER') or 'info@dokuio.com'
          cfg = {
              'host': 'mail.next01.exon.io',
              'port': 465,
              'sifrovani': 'ssl',
              'uzivatel': uzivatel,
              'heslo': os.environ['SMTP_PASSWORD'],
              'od': uzivatel,
              'denni_limit': 300,
              'sul': secrets.token_hex(16),
          }
          b = base64.b64encode(json.dumps(cfg).encode()).decode()
          with open('dist/smtp-config.php', 'w') as f:
              f.write("<?php // generováno při deployi ze secretů GitHubu – necommitovat\nreturn json_decode(base64_decode('" + b + "'), true);\n")
          PY

      - name: Kontrola přístupových údajů
        if: env.FTP_PASSWORD == ''
        run: echo "::warning::Chybí secret FTP_PASSWORD – web je sestavený, ale nenahrál se na hosting."

      - name: Příprava rozbalovače
        if: env.FTP_PASSWORD != ''
        run: |
          RAND=$(openssl rand -hex 12)
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          HASH=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)
          ZIP="_site-$RAND.zip"
          PHP="_deploy-$RAND.php"
          sed -e "s/__TOKEN_HASH__/$HASH/" -e "s/__ZIP_NAME__/$ZIP/" deploy/deploy.php > "$PHP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "PHP=$PHP" >> "$GITHUB_ENV"
          echo "DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -sS --fail --ssl-reqd --insecure --retry 3 --user "$FTP_USERNAME:$FTP_PASSWORD" -T "$PHP" "ftp://$FTP_SERVER/$PHP"

      - name: Porovnání se serverem (jen změněné soubory)
        if: env.FTP_PASSWORD != ''
        shell: bash
        run: |
          set -uo pipefail
          chyba() { echo "::error::$1"; exit 1; }
          (cd dist && find . -type f -print0 | sort -z | xargs -0 md5sum | sed -E 's#^([0-9a-f]+)  \./(.*)$#\2\t\1#') > novy-manifest.txt || chyba "výpočet otisků selhal"
          curl -sS --max-time 120 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" -d akce=manifest "https://$SITE_HOST/$PHP" -o stary-manifest.txt \
            || curl -sS --max-time 120 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" -d akce=manifest "http://$SITE_HOST/$PHP" -o stary-manifest.txt \
            || : > stary-manifest.txt
          # Starý manifest bez otisků (první deploy) → nahrát vše
          if [ "$(grep -cP '\t[0-9a-f]{32}$' stary-manifest.txt || true)" -gt 0 ]; then
            awk -F'\t' 'NR==FNR { s[$1]=$2; next } s[$1] != $2 { print $1 }' stary-manifest.txt novy-manifest.txt > zmenene.txt || chyba "porovnání selhalo"
          else
            cut -f1 novy-manifest.txt > zmenene.txt
          fi
          echo "::notice::Změněných souborů: $(wc -l < zmenene.txt) z $(wc -l < novy-manifest.txt)"
          cp novy-manifest.txt dist/.deploy-manifest-new.txt
          echo ".deploy-manifest-new.txt" >> zmenene.txt
          python3 - "$ZIP" <<'PY' || chyba "vytvoření ZIPu selhalo"
          import sys, zipfile, os
          cil = sys.argv[1]
          with open('zmenene.txt', encoding='utf-8') as f:
              soubory = [r.rstrip('\n') for r in f if r.strip()]
          with zipfile.ZipFile(cil, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for s in soubory:
                  z.write(os.path.join('dist', s), s)
          print(f'ZIP: {len(soubory)} souborů, {os.path.getsize(cil) / 1e6:.1f} MB')
          PY

      - name: Nahrání ZIPu (FTPS)
        if: env.FTP_PASSWORD != ''
        run: |
          curl -sS --fail --ssl-reqd --insecure --retry 3 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T "$ZIP" "ftp://$FTP_SERVER/$ZIP"

      - name: Rozbalení na serveru
        if: env.FTP_PASSWORD != ''
        run: |
          for scheme in https http; do
            if out=$(curl -sS --fail --max-time 300 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" -d akce=rozbalit "$scheme://$SITE_HOST/$PHP" 2>&1); then
              echo "$out"
              echo "::notice::$out"
              exit 0
            fi
            echo "$scheme: $out"
          done
          echo "::error::Rozbalení na serveru selhalo"
          exit 1

      - name: Ohlášení změn vyhledávačům (IndexNow – Bing, Seznam)
        if: env.FTP_PASSWORD != ''
        continue-on-error: true
        run: python3 deploy/indexnow.py zmenene.txt
